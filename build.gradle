plugins {
    id 'java-library'
    id 'groovy'
    id 'application'
}

group = 'com.vantor.nitf'
version = '0.1.0-SNAPSHOT'

ext {
    imagingNitfVersion = '0.10'
    spockVersion = '2.4-groovy-4.0'
    junitPlatformVersion = '1.14.1'
}

repositories {
    mavenCentral()
    maven {
        name = 'codiceReleases'
        url = uri('https://repo.codice.org/repository/maven-releases/')
        mavenContent {
            releasesOnly()
        }
    }
    maven {
        name = 'codicePublic'
        url = uri('https://repo.codice.org/repository/maven-public/')
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
}

dependencies {
    // Released, unmodified upstream artifacts.
    api "org.codice.imaging.nitf:codice-imaging-nitf-fluent:${imagingNitfVersion}"

    testImplementation "org.spockframework:spock-core:${spockVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
}

/*
 * Two command-line entry points share one distribution. The application plugin
 * generates a start script only for `mainClass`, so nei-validator gets its own
 * CreateStartScripts task and is copied into the distribution's bin directory.
 * The classpath is declared lazily from the jar plus runtimeClasspath so the
 * generated script resolves lib/ the same way the primary one does.
 */
def neiValidatorStartScripts = tasks.register('neiValidatorStartScripts', CreateStartScripts) {
    mainClass = 'com.vantor.nitf.nei.NeiValidate'
    applicationName = 'nei-validator'
    outputDir = layout.buildDirectory.dir('nei-validator-scripts').get().asFile
    classpath = files(tasks.named('jar'), configurations.runtimeClasspath)
}

application {
    mainClass = 'com.vantor.nitf.nei.NeiInfo'
    applicationName = 'nei-info'

    applicationDistribution.from(neiValidatorStartScripts) {
        into 'bin'
        filePermissions {
            unix(0755)
        }
    }
}

// applicationName would otherwise also name the distribution, and the
// distribution holds both tools, so keep it named after the project.
distributions.main.distributionBaseName = 'imaging-nitf-nei'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

tasks.withType(GroovyCompile).configureEach {
    groovyOptions.encoding = 'UTF-8'
}

/*
 * NeiSampleSpec runs against real vendor products, which are deliberately not
 * committed here. Point the build at a directory of them with either:
 *
 *     ./gradlew test -PneiSamplesDir=/path/to/nei-samples
 *     NEI_SAMPLES_DIR=/path/to/nei-samples ./gradlew test
 *
 * With neither set, those features skip rather than fail. Add -PneiRegolden to
 * rewrite the golden summaries instead of comparing against them.
 */
tasks.named('test') {
    useJUnitPlatform()

    def samplesDir = findProperty('neiSamplesDir') ?: System.getenv('NEI_SAMPLES_DIR')
    if (samplesDir) {
        systemProperty 'nei.samples.dir', samplesDir as String
    }
    if (findProperty('neiRegolden') != null) {
        systemProperty 'nei.regolden', 'true'
    }

    testLogging {
        events 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'com.vantor.nitf.nei')
    }
}
